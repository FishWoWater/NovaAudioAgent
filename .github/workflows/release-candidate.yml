name: Release candidate evidence

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Application version to validate
        required: true
        default: 0.1.1
        type: string
      candidate_scope:
        description: Full release evidence or a Windows-only repair run
        required: true
        default: full
        type: choice
        options:
          - full
          - windows

permissions:
  contents: read

jobs:
  platform-candidate:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            target_id: darwin-arm64
            package_script: package:mac:candidate
            artifact_name: candidate-darwin-arm64
          - os: windows-latest
            platform: win32
            target_id: win32-x64
            package_script: package:win
            artifact_name: candidate-win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        if: inputs.candidate_scope == 'full' || matrix.platform == 'win32'
      - uses: actions/setup-node@v4
        if: inputs.candidate_scope == 'full' || matrix.platform == 'win32'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.6.0
        if: inputs.candidate_scope == 'full' || matrix.platform == 'win32'
      - run: npm ci
        if: inputs.candidate_scope == 'full' || matrix.platform == 'win32'
      - run: npm run check
        if: inputs.candidate_scope == 'full'
      - run: npm run test:runtime
        if: inputs.candidate_scope == 'full' && runner.os != 'Windows'
      - run: npm run test:runtime:win
        if: runner.os == 'Windows'
      # npm may restore the Electron package without its platform binary from
      # cache. The pinned install script is idempotent and closes that gap.
      - run: node clients/desktop/node_modules/electron/install.js
        if: inputs.candidate_scope == 'full' || matrix.platform == 'win32'
      - run: npm run test:desktop
        if: inputs.candidate_scope == 'full' || matrix.platform == 'win32'
      - run: npm run test:cli
        if: inputs.candidate_scope == 'full'
      - name: Build unsigned candidate bytes
        if: inputs.candidate_scope == 'full' || matrix.platform == 'win32'
        run: npm run ${{ matrix.package_script }} --workspace @nova-audio-agent/desktop
      - name: Verify installed application and backend
        if: inputs.candidate_scope == 'full' || matrix.platform == 'win32'
        run: npm run verify:release --workspace @nova-audio-agent/desktop -- --unsigned
      - name: Archive macOS application with native tools
        if: matrix.platform == 'darwin' && inputs.candidate_scope == 'full'
        shell: bash
        run: |
          mkdir -p candidate
          ditto -c -k --keepParent "clients/desktop/dist/mac-arm64/Nova Audio Agent Desktop.app" candidate/nova-audio-agent-${{ inputs.release_version }}-macos-arm64-app.zip
          cp clients/desktop/dist/*.dmg candidate/nova-audio-agent-${{ inputs.release_version }}-macos-arm64.dmg
      - name: Archive Windows application with native tools
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force candidate
          tar.exe -a -c -f candidate/nova-audio-agent-${{ inputs.release_version }}-windows-x64-portable.zip -C clients/desktop/dist/win-unpacked .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item clients/desktop/dist/*.exe candidate/nova-audio-agent-${{ inputs.release_version }}-windows-x64.exe
      - name: Verify macOS installer
        if: matrix.platform == 'darwin' && inputs.candidate_scope == 'full'
        run: npm run verify:release --workspace @nova-audio-agent/desktop -- --unsigned --artifact "${{ github.workspace }}/candidate/nova-audio-agent-${{ inputs.release_version }}-macos-arm64.dmg"
      - name: Verify Windows installer
        if: matrix.platform == 'win32'
        run: npm run verify:release --workspace @nova-audio-agent/desktop -- --unsigned --artifact "${{ github.workspace }}/candidate/nova-audio-agent-${{ inputs.release_version }}-windows-x64.exe"
      - name: Write CLI download checksums
        if: inputs.candidate_scope == 'full' || matrix.platform == 'win32'
        shell: bash
        run: |
          cd candidate
          for artifact in *; do
            if command -v sha256sum >/dev/null; then sha256sum "$artifact" > "$artifact.sha256"; else shasum -a 256 "$artifact" > "$artifact.sha256"; fi
          done
      - uses: actions/upload-artifact@v4
        if: inputs.candidate_scope == 'full' || matrix.platform == 'win32'
        with:
          name: ${{ matrix.artifact_name }}
          path: candidate/*
          if-no-files-found: error
