name: Unsigned Windows package diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin the audited VS2022 toolchain; windows-latest now rolls to
          # Visual Studio 2026 and is not a reproducible native build input.
          - os: windows-2022
            target_id: win32-x64
            package_script: package:win
            artifact_name: unsigned-win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - run: npm run check
      - run: npm run test:runtime:win
      - run: npm run test:desktop
      - run: npm run build
      - name: Build unsigned native package bytes
        run: npm run ${{ matrix.package_script }} --workspace @nova-audio-agent/desktop
      - run: npm run verify:release --workspace @nova-audio-agent/desktop -- --unsigned
      - name: Verify installed NSIS candidate
        shell: pwsh
        run: |
          $installer = (Get-ChildItem clients/desktop/dist/*.exe).FullName
          npm run verify:release --workspace @nova-audio-agent/desktop -- --unsigned --artifact "$installer"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: clients/desktop/dist/*.exe
          if-no-files-found: error
