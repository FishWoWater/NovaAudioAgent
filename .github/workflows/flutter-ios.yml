name: Flutter iOS device build
on:
  push:
    paths: ['clients/flutter/**', '.github/workflows/flutter-ios.yml']
  pull_request:
    paths: ['clients/flutter/**', '.github/workflows/flutter-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-and-notification-service:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      NOVA_CI_ROOT: ${{ runner.temp }}/nova-flutter-ios-${{ github.run_id }}-${{ github.run_attempt }}
      NOVA_LINUX_ROOT: ${{ runner.temp }}/nova-flutter-ios-${{ github.run_id }}-${{ github.run_attempt }}/linux
      XDG_CONFIG_HOME: ${{ runner.temp }}/nova-flutter-ios-${{ github.run_id }}-${{ github.run_attempt }}/flutter-config
      PUB_CACHE: ${{ runner.temp }}/nova-flutter-ios-${{ github.run_id }}-${{ github.run_attempt }}/pub-cache
      CP_HOME_DIR: ${{ runner.temp }}/nova-flutter-ios-${{ github.run_id }}-${{ github.run_attempt }}/cocoapods
      CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/nova-flutter-ios-${{ github.run_id }}-${{ github.run_attempt }}/clang-cache
      HOMEBREW_CACHE: ${{ runner.temp }}/nova-flutter-ios-${{ github.run_id }}-${{ github.run_attempt }}/brew-cache
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify ARM64 and Xcode
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          mkdir -p "$NOVA_CI_ROOT/tmp"
          echo "TMPDIR=$NOVA_CI_ROOT/tmp/" >> "$GITHUB_ENV"
      - name: Install native runtime toolchain
        run: |
          brew install llvm lld libarchive pkgconf
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix libarchive)/lib/pkgconfig" >> "$GITHUB_ENV"
          pod --version
          python3 --version
      - name: Install Flutter 3.47.7 in the isolated build directory
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$NOVA_CI_ROOT/flutter-sdk"
          echo "$NOVA_CI_ROOT/flutter-sdk/bin" >> "$GITHUB_PATH"
          "$NOVA_CI_ROOT/flutter-sdk/bin/flutter" --version
      - name: Build complete unsigned Flutter Runner and NSE for iPhone
        run: bash clients/flutter/tool/ci/build_ios.sh
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ios-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.NOVA_CI_ROOT }}/xcodebuild.log
            ${{ env.NOVA_CI_ROOT }}/FlutterRunner.xcresult
            ${{ env.NOVA_LINUX_ROOT }}/manifest.json
          if-no-files-found: warn
          retention-days: 14
