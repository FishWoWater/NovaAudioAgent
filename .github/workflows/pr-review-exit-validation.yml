name: Validate PR review exit fix
on:
  push:
    branches: [feature/pr-review-exit-validation]
permissions:
  contents: read
jobs:
  review:
    if: github.repository == 'FishWoWater/NovaAudioAgent'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sample: [pr12-first, pr12-repeat, pr24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Fetch public review objects and prepare trusted prompt
        env:
          SAMPLE: ${{ matrix.sample }}
        run: |
          if [ "$SAMPLE" = pr24 ]; then
            head=ef0890acc13d7bada980cc2c2ce41ca351e7b2d0
            base=5d87d49cf29acdaaa57be0da7ba8f117836f28c5
            number=24
          else
            head=d4641260cf9f775c5ba6016e41679df6891586d3
            base=9e1c72574bc7eb038099cd02b02b9c3f6a81c293
            number=12
          fi
          git -c core.hooksPath=/dev/null fetch --no-tags https://github.com/deepnovacore/NovaAudioAgent.git "$base" "$head"
          {
            cat .github/codex/review.md
            printf '\nPR number: %s\nBASE_SHA: %s\nHEAD_SHA: %s\nRepository: deepnovacore/NovaAudioAgent\n' "$number" "$base" "$head"
          } > "$RUNNER_TEMP/nova-review-prompt.md"
      - name: Prepare an isolated review user without changing runner services
        run: |
          sudo useradd --create-home --user-group --shell /bin/bash nova-review
          sudo chmod 755 /home/nova-review
          sudo install -d -o nova-review -g nova-review -m 755 /home/nova-review/.codex
          sudo install -o root -g root -m 644 .github/codex/config.toml /home/nova-review/.codex/config.toml
          # The proxy starts as runner; the action locks this file before Codex starts.
          sudo touch "/home/nova-review/.codex/$GITHUB_RUN_ID.json"
          sudo chmod 666 "/home/nova-review/.codex/$GITHUB_RUN_ID.json"
          # Only the public checkout is shared; ancestor directories need traversal only.
          chmod -R a+rX "$GITHUB_WORKSPACE"
          chmod o+x /home/runner "$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE/../.."
          sudo -u nova-review git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(id -Gn nova-review)" = nova-review
          sudo -u nova-review test -r "$GITHUB_WORKSPACE/.git/HEAD"
          if sudo -u nova-review sudo -n true 2>/dev/null || sudo -u nova-review test -w "$GITHUB_WORKSPACE"; then
            echo 'Review user must have neither sudo nor checkout write access.' >&2
            exit 1
          fi
      - name: Review using patched action and isolated review user
        id: codex
        timeout-minutes: 15
        uses: openai/codex-action@f93255fd2e5a17a0b4bd557599535e80c8607537
        with:
          codex-version: '0.156.1'
          openai-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          responses-api-endpoint: https://openrouter.ai/api/v1/responses
          model: qwen/qwen3.8-flash
          effort: medium
          safety-strategy: unprivileged-user
          codex-user: nova-review
          permission-profile: ':read-only'
          codex-home: /home/nova-review/.codex
          prompt-file: ${{ runner.temp }}/nova-review-prompt.md
          codex-args: '["--ephemeral"]'
      - name: Verify output is exported and later steps run
        env:
          REVIEW_MESSAGE: ${{ steps.codex.outputs.final-message }}
        run: |
          node - <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const output = process.env.REVIEW_MESSAGE;
          assert.ok(output.trim());
          assert.ok(Buffer.byteLength(output) <= 48000);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Action exited successfully and exported ${Buffer.byteLength(output)} bytes.\n\n${output}`);
          console.log(`Verified default-path final-message (${Buffer.byteLength(output)} bytes); subsequent step reached.`);
          JS
