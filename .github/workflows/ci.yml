name: CI

on:
  push:
    branches: ["main", "v0.2.0dev", "v0.3.0dev", "v0.3.0post.dev", "v0.4.0dev", "v1.0.0dev", "v1.1.0dev"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  review-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test .github/scripts/pr-review.test.cjs

  space-stack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:space -- --output-root "${{ runner.temp }}" --run-id "space-${{ github.run_id }}-${{ github.run_attempt }}"
      - run: npm run test:space -- --output-root "${{ runner.temp }}" --run-id "space-${{ github.run_id }}-${{ github.run_attempt }}"
      - run: node push-gateway/test/native-crypto-checks.mjs --output-root "${{ runner.temp }}" --run-id "space-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Verify Space tests with a symlinked temporary directory
        if: runner.os != 'Windows'
        run: |
          temp_root="$RUNNER_TEMP/space-temp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$temp_root/real"
          ln -s "$temp_root/real" "$temp_root/alias"
          TMPDIR="$temp_root/alias" npm run test:space -- --output-root "$RUNNER_TEMP" --run-id "space-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  flutter-space:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      NOVA_RELAY_BUILD_ROOT: ${{ github.workspace }}/relay/dist/src
      NOVA_GATEWAY_BUILD_ROOT: ${{ github.workspace }}/push-gateway/dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund -w relay -w push-gateway --include-workspace-root
      - run: npm run build -w relay && npm run build -w push-gateway
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter-sdk"
          echo "$RUNNER_TEMP/flutter-sdk/bin" >> "$GITHUB_PATH"
      - name: Analyze and exercise real Dart to Node Space contracts
        working-directory: clients/flutter
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test test/space_*test.dart

  electron:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - run: npm run check
        env:
          # tsc + eslint over runtime can exceed the default ~2 GB heap on the macOS runner.
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run test:runtime
        if: runner.os != 'Windows'
      # Full runtime regression runs on macOS/Linux; Windows keeps platform
      # coverage plus the desktop/native/installer acceptance below.
      - run: npm run test:runtime:win:platform
        if: runner.os == 'Windows'
      - run: npm run test:live:contract --workspace @nova-personal-agent/runtime
      - run: npm run test:server-cli
      - run: npm run test:cli
      # The self-hosted serving launcher's tests need no models or GPU; its process checks are Linux-only.
      - run: python3 -m unittest discover -s serving
        if: runner.os == 'Linux'
      # npm may restore the Electron package without its platform binary from
      # cache. The pinned install script is idempotent and closes that gap.
      - run: node clients/desktop/node_modules/electron/install.js
      - name: Configure Linux V8 header compatibility
        if: runner.os == 'Linux'
        run: echo "CXXFLAGS=-UV8_DEPRECATION_WARNINGS" >> "$GITHUB_ENV"
      - name: Run npm run test:desktop
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "nova-desktop-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          npm run test:desktop 2>&1 | Tee-Object "$evidence/desktop-tests.log"
          $code = $LASTEXITCODE
          "exit_code=$code" | Set-Content "$evidence/result.txt"
          if ($code -ne 0 -and '${{ runner.os }}' -eq 'Windows') {
            $match = Select-String -Path "$evidence/desktop-tests.log" -Pattern 'source_startup_smoke_(timeout|failed)[^\r\n]*' | Select-Object -Last 1
            $detail = if ($match) { $match.Matches[0].Value } else {
              $failures = @(Select-String -Path "$evidence/desktop-tests.log" -Pattern @('not ok\b', '^\s*[✖✗×]\s', '^\s*(?:[A-Za-z]*Error(?:\s+\[[A-Z0-9_]+\])?:|error:)', 'error TS[0-9]+:', '^\s*npm (?:ERR!|error)\b') | Select-Object -First 12 | ForEach-Object {
                if ($_.Line.Length -gt 300) { $_.Line.Substring(0, 300) } else { $_.Line }
              })
              if ($failures.Count -gt 0) { $failures -join "`n" } else { 'Desktop command failed without matching error lines; inspect retained artifact.' }
            }
            $safe = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows desktop diagnostic::$safe"
          }
          exit $code
      - name: Retain desktop test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-tests-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nova-desktop-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Run macOS capability status smoke
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "nova-capability-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          npm run smoke:capability-status --workspace @nova-personal-agent/desktop 2>&1 | Tee-Object -FilePath "$evidence/capability-smoke.log"
          $code = $LASTEXITCODE
          "exit_code=$code" | Set-Content "$evidence/result.txt"
          if ($code -ne 0) {
            $lines = @(Get-Content "$evidence/capability-smoke.log" | Select-Object -Last 30 | ForEach-Object {
              if ($_.Length -gt 300) { $_.Substring(0, 300) } else { $_ }
            })
            $safe = ($lines -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=macOS capability smoke diagnostic::$safe"
          }
          exit $code
      - name: Retain capability smoke evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: capability-smoke-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nova-capability-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14
      - run: npm run build
      - name: Accept native workbench Agent Loop in Electron
        if: runner.os == 'macOS' || runner.os == 'Windows'
        shell: pwsh
        env:
          NOVA_TEST_DIST: ${{ github.workspace }}/runtime/dist
          NOVA_ACCEPTANCE_ROOT: ${{ runner.temp }}/workbench-agent-${{ github.run_id }}-${{ github.run_attempt }}
          CODEX_RESOURCES_PATH: ${{ github.workspace }}/clients/desktop/build
        run: |
          New-Item -ItemType Directory -Force -Path $env:NOVA_ACCEPTANCE_ROOT | Out-Null
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          npm run test:workbench-agent --workspace @nova-personal-agent/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always() && (runner.os == 'macOS' || runner.os == 'Windows')
        with:
          name: workbench-agent-${{ runner.os }}
          path: ${{ runner.temp }}/workbench-agent-${{ github.run_id }}-${{ github.run_attempt }}/*
          if-no-files-found: warn
      - name: Verify installed headless npm package
        if: runner.os == 'Linux'
        run: |
          umask 077
          tarball="$(node scripts/pack-server.mjs server-candidate)"
          npm install --prefix server-smoke "$tarball"
          node scripts/verify-server-package.mjs server-smoke/node_modules/.bin/novapersonal-server

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    # Build candidate artifacts independently; release-publish enforces acceptance before publishing.
    needs: [electron]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac:candidate
            artifact: nova-personal-agent-desktop-mac
          - os: windows-latest
            script: package:win
            artifact: nova-personal-agent-desktop-win
          - os: ubuntu-22.04
            script: package:linux
            artifact: nova-personal-agent-desktop-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - name: Prepare Linux packaging
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y g++-12 xvfb libasound2 libgtk-3-0 libnss3 libgbm1 libsecret-1-0
          echo "CXX=g++-12" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-UV8_DEPRECATION_WARNINGS" >> "$GITHUB_ENV"
      - run: npm run ${{ matrix.script }}
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} npm run verify:release --workspace @nova-personal-agent/desktop -- --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: clients/desktop/dist/**
          if-no-files-found: error
