name: CI

on:
  push:
    branches: ["main", "v0.2.0dev", "v0.3.0dev", "v0.3.0post.dev", "v0.4.0dev", "v1.0.0dev", "v1.1.0dev"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  review-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test .github/scripts/pr-review.test.cjs

  space-stack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:space -- --output-root "${{ runner.temp }}" --run-id "space-${{ github.run_id }}-${{ github.run_attempt }}"
      - run: npm run test:space -- --output-root "${{ runner.temp }}" --run-id "space-${{ github.run_id }}-${{ github.run_attempt }}"
      - run: node push-gateway/test/native-crypto-checks.mjs --output-root "${{ runner.temp }}" --run-id "space-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Verify Space tests with a symlinked temporary directory
        run: |
          temp_root="$RUNNER_TEMP/space-temp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$temp_root/real"
          ln -s "$temp_root/real" "$temp_root/alias"
          TMPDIR="$temp_root/alias" npm run test:space -- --output-root "$RUNNER_TEMP" --run-id "space-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  electron:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - run: npm run check
        env:
          # tsc + eslint over runtime can exceed the default ~2 GB heap on the macOS runner.
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run test:runtime
        if: runner.os != 'Windows'
      # Full runtime regression runs on macOS/Linux; Windows keeps platform
      # coverage plus the desktop/native/installer acceptance below.
      - run: npm run test:runtime:win:platform
        if: runner.os == 'Windows'
      - run: npm run test:live:contract --workspace @nova-personal-agent/runtime
      - run: npm run test:server-cli
      - run: npm run test:cli
      # The self-hosted serving launcher's tests need no models or GPU; its process checks are Linux-only.
      - run: python3 -m unittest discover -s serving
        if: runner.os == 'Linux'
      # npm may restore the Electron package without its platform binary from
      # cache. The pinned install script is idempotent and closes that gap.
      - run: node clients/desktop/node_modules/electron/install.js
      - name: Configure Linux V8 header compatibility
        if: runner.os == 'Linux'
        run: echo "CXXFLAGS=-UV8_DEPRECATION_WARNINGS" >> "$GITHUB_ENV"
      - run: npm run test:desktop
      - run: npm run smoke:capability-status --workspace @nova-personal-agent/desktop
        if: runner.os == 'macOS'
      - run: npm run build
      - name: Accept native workbench Agent Loop in Electron
        if: runner.os == 'macOS' || runner.os == 'Windows'
        shell: pwsh
        env:
          NOVA_TEST_DIST: ${{ github.workspace }}/runtime/dist
          NOVA_ACCEPTANCE_ROOT: ${{ runner.temp }}/workbench-agent-${{ github.run_id }}-${{ github.run_attempt }}
          CODEX_RESOURCES_PATH: ${{ github.workspace }}/clients/desktop/build
        run: |
          New-Item -ItemType Directory -Force -Path $env:NOVA_ACCEPTANCE_ROOT | Out-Null
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          npm run test:workbench-agent --workspace @nova-personal-agent/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always() && (runner.os == 'macOS' || runner.os == 'Windows')
        with:
          name: workbench-agent-${{ runner.os }}
          path: ${{ runner.temp }}/workbench-agent-${{ github.run_id }}-${{ github.run_attempt }}/*
          if-no-files-found: warn
      - name: Verify installed headless npm package
        if: runner.os == 'Linux'
        run: |
          umask 077
          tarball="$(node scripts/pack-server.mjs server-candidate)"
          npm install --prefix server-smoke "$tarball"
          node scripts/verify-server-package.mjs server-smoke/node_modules/.bin/novapersonal-server

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    # Build candidate artifacts independently; release-publish enforces acceptance before publishing.
    needs: [electron]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac:candidate
            artifact: nova-personal-agent-desktop-mac
          - os: windows-latest
            script: package:win
            artifact: nova-personal-agent-desktop-win
          - os: ubuntu-22.04
            script: package:linux
            artifact: nova-personal-agent-desktop-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - name: Prepare Linux packaging
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y g++-12 xvfb libasound2 libgtk-3-0 libnss3 libgbm1 libsecret-1-0
          echo "CXX=g++-12" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-UV8_DEPRECATION_WARNINGS" >> "$GITHUB_ENV"
      - run: npm run ${{ matrix.script }}
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} npm run verify:release --workspace @nova-personal-agent/desktop -- --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: clients/desktop/dist/**
          if-no-files-found: error
