name: Windows shell diagnostic
on:
  push:
    branches: [fix/pr31-ci-workbench]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - run: npm run build --workspace @nova-personal-agent/runtime
      - run: node scripts/windows-shell-ci-diagnostic.mjs
